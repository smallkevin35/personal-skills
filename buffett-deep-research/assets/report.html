<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{company}} · 巴菲特-深度研究</title>
<style>
:root {
  color-scheme: light;
  --ink: #172b33;
  --muted: #425b64;
  --accent: #125d54;
  --rule: #d4dfdd;
  --paper: #fff;
  --tint: #f1f7f4;
  font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: #f5f8f6; color: var(--ink); line-height: 1.68; }
a { color: var(--accent); text-underline-offset: .19em; }
a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.shell { width: min(100% - 2rem, 74rem); margin: auto; }
header { padding: 3rem 0 1.5rem; }
.kicker { color: var(--accent); font-size: .88rem; font-weight: 700; letter-spacing: .12em; }
h1, h2, h3 { line-height: 1.3; }
h1 { margin: .3em 0; font-size: clamp(1.9rem, 6vw, 3.8rem); overflow-wrap: anywhere; }
h2 { font-size: 1.55rem; margin-top: 0; }
h3 { margin-top: 1.65em; }
.meta { color: var(--muted); }
nav { display: flex; flex-wrap: wrap; gap: .35rem 1.1rem; padding: .9rem 0; border-block: 1px solid var(--rule); }
main { padding: 1.35rem 0 2rem; }
section { background: var(--paper); border: 1px solid var(--rule); border-radius: .65rem; margin: 0 0 1.1rem; padding: clamp(1rem, 3.5vw, 2rem); }
.lead { margin: 1rem 0; padding: .8rem 1rem; background: var(--tint); border-inline-start: .25rem solid var(--accent); font-weight: 650; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
caption { text-align: start; font-weight: 650; padding: .5rem 0; }
th, td { border-bottom: 1px solid var(--rule); text-align: start; padding: .55rem .7rem; vertical-align: top; }
th { background: var(--tint); }
tbody th[scope="row"] { white-space: nowrap; }
.num { text-align: end; white-space: nowrap; }
svg { max-width: 100%; height: auto; }
details { margin: .7rem 0; border-top: 1px solid var(--rule); padding-top: .6rem; }
summary { cursor: pointer; font-weight: 650; }
footer { border-top: 1px solid var(--rule); padding: 0 0 1.5rem; color: var(--muted); font-size: .9rem; }
[id] { scroll-margin-top: 1rem; }
:target { outline: 2px solid var(--rule); outline-offset: .2rem; }
@media print {
  body, section { background: white; }
  .shell { width: 100%; }
  header { padding-top: 0; }
  section { padding: .65rem 0; border: 0; }
  h2, h3, caption { break-after: avoid; }
  thead { display: table-header-group; }
  tr, figure { break-inside: avoid; }
  .table-wrap { overflow: visible; }
  table { font-size: 9pt; }
  th, td { padding: .25rem; }
}
</style>
</head>
<body>
<header class="shell">
  <p class="kicker">巴菲特-深度研究</p>
  <h1>{{company}}</h1>
  <p class="meta">{{report_meta}}</p>
  <nav aria-label="报告目录">
    <a href="#summary">核心结论</a>
    <a href="#history">历史经营</a>
    <a href="#moat">商业模式与护城河</a>
    <a href="#growth">未来成长性</a>
    <a href="#management">管理层</a>
    <a href="#returns">投资回报</a>
    <a href="#appendix">附录</a>
  </nav>
</header>
<main class="shell">
  <section id="summary">
    <h2>核心结论</h2>
    {{summary}}
  </section>
  <section id="history">
    <h2>一、历史经营复盘</h2>
    {{history}}
  </section>
  <section id="moat">
    <h2>二、商业模式与护城河</h2>
    {{moat}}
  </section>
  <section id="growth">
    <h2>三、未来成长性</h2>
    {{growth}}
  </section>
  <section id="management">
    <h2>四、管理层</h2>
    {{management}}
  </section>
  <section id="returns">
    <h2>五、投资回报</h2>
    {{returns}}
  </section>
  <section id="appendix">
    <h2>附录</h2>
    {{appendix}}
  </section>
</main>
<footer class="shell">
  <p>买方研究笔记 · 金额、期间及预测口径见正文与附录</p>
</footer>
</body>
</html>
